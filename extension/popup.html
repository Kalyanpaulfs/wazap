<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wazap</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      background: #0a0f0a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #1e2d1e;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }
    .logo-text {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #25D366, #128C7E);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tagline {
      font-size: 11px;
      color: #64748b;
      margin-left: auto;
    }

    /* Body */
    .body { padding: 14px 16px; }

    /* Phone row */
    .phone-row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    select, input, textarea {
      background: #111811;
      border: 1px solid #1e3a1e;
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 13px;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    select:focus, input:focus, textarea:focus {
      border-color: #25D366;
    }
    select {
      width: 110px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .phone-input {
      flex: 1;
      min-width: 0;
    }

    textarea {
      width: 100%;
      resize: none;
      height: 70px;
      margin-bottom: 12px;
      font-family: inherit;
    }
    textarea::placeholder, input::placeholder {
      color: #334155;
    }

    /* Open button */
    .btn-open {
      width: 100%;
      padding: 11px;
      border-radius: 999px;
      border: none;
      background: #25D366;
      color: #000;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
    }
    .btn-open:hover { background: #1fba58; }
    .btn-open:disabled { opacity: 0.4; cursor: default; }
    .btn-open svg { width: 16px; height: 16px; }

    /* Recent */
    .recent-label {
      font-size: 11px;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 14px 0 8px;
    }
    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .recent-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #111811;
      border: 1px solid #1e2d1e;
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .recent-item:hover { border-color: #25D366; }
    .recent-number {
      font-size: 13px;
      color: #cbd5e1;
      font-family: monospace;
    }
    .recent-open {
      font-size: 11px;
      color: #25D366;
      font-weight: 600;
    }
    .no-recent {
      font-size: 12px;
      color: #334155;
      text-align: center;
      padding: 8px 0;
    }

    /* Footer */
    .footer {
      padding: 10px 16px 14px;
      border-top: 1px solid #1e2d1e;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer a {
      font-size: 11px;
      color: #25D366;
      text-decoration: none;
    }
    .footer a:hover { text-decoration: underline; }
    .footer-note {
      font-size: 11px;
      color: #334155;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: #25D366;
      color: #000;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
